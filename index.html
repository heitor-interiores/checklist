<!DOCTYPE html>
<!-- persist-fix-v2 -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist — Igreja Nova Aliança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Raleway:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-green:#38573B; --light-green:#ACC1B0; --neutral:#D7D7CD;
    --gray:#D2D2D2; --gold:#BC9E56;
    --bg:#FAFAF8; --card:#FFFFFF; --text:#2B332C; --muted:#6B756D; --border:#E4E4DE;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C211D; --card:#242A24; --text:#EDEFEC; --muted:#A7B0A9; --border:#37403A;
      --neutral:#3A4238;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C211D; --card:#242A24; --text:#EDEFEC; --muted:#A7B0A9; --border:#37403A; --neutral:#3A4238;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Raleway',sans-serif; min-height:100%;
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:640px; padding:28px 20px 60px;}
  header{text-align:center; margin-bottom:24px;}
  h1{
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:22px;
    letter-spacing:.06em; text-transform:uppercase; margin:0 0 4px;
    color:var(--dark-green);
  }
  :root[data-theme="dark"] h1, @media (prefers-color-scheme: dark){ h1{color:var(--light-green);} }
  section{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px; margin-bottom:18px;
  }
  h2{
    font-family:'Montserrat',sans-serif; font-weight:600; font-size:15px;
    letter-spacing:.04em; text-transform:uppercase; margin:0 0 14px; color:var(--dark-green);
  }
  @media (prefers-color-scheme: dark){ h2{color:var(--light-green);} }
  :root[data-theme="dark"] h2{color:var(--light-green);}
  .onedrive a{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--dark-green); color:#fff; text-decoration:none;
    font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px;
    padding:13px 16px; border-radius:8px; letter-spacing:.03em;
  }
  .onedrive a:hover{opacity:.92;}
  .onedrive p{color:var(--muted); font-size:13px; margin:10px 0 0;}
  .add-row{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .add-row input[type=text]{
    flex:1; min-width:140px; padding:11px 12px; border:1px solid var(--border); border-radius:8px;
    font-family:'Raleway',sans-serif; font-size:14px; background:var(--bg); color:var(--text);
  }
  .add-row input[type=date]{
    padding:11px 10px; border:1px solid var(--border); border-radius:8px;
    font-family:'Raleway',sans-serif; font-size:13px; background:var(--bg); color:var(--text);
  }
  .add-row button{
    background:var(--gold); color:#fff; border:none; border-radius:8px;
    padding:0 18px; font-family:'Montserrat',sans-serif; font-weight:600; font-size:13px;
    cursor:pointer; letter-spacing:.03em;
  }
  .add-row button:disabled, .add-row input:disabled{opacity:.5; cursor:not-allowed;}
  ul#list{list-style:none; margin:0; padding:0;}
  li.item{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px solid var(--border);
  }
  li.item:last-child{border-bottom:none;}
  li.item input[type=checkbox]{
    width:19px; height:19px; accent-color:var(--dark-green); flex-shrink:0; cursor:pointer;
  }
  li.item .txt{flex:1; min-width:0;}
  li.item span{font-size:14.5px; word-break:break-word;}
  li.item.done span{color:var(--muted); text-decoration:line-through;}
  .due{display:block; font-size:12px; margin-top:2px; color:var(--muted);}
  .due.soon{color:var(--gold); font-weight:600;}
  .due.late{color:#B33; font-weight:600;}
  li.item .del{
    background:none; border:none; color:var(--muted); font-size:18px;
    cursor:pointer; line-height:1; padding:4px 6px;
  }
  li.item .del:hover{color:#B33;}
  .empty{color:var(--muted); font-size:13.5px; font-style:italic; padding:6px 4px;}
  .banner{
    background:var(--neutral); color:var(--text); font-size:13px;
    padding:9px 12px; border-radius:8px; margin-top:12px;
  }
  ul#prazosList{list-style:none; margin:0; padding:0;}
  ul#prazosList li{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    padding:9px 4px; border-bottom:1px solid var(--border); font-size:14px;
  }
  ul#prazosList li:last-child{border-bottom:none;}
  footer{text-align:center; color:var(--muted); font-size:12px; margin-top:6px;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Igreja Nova Aliança</h1>
    </header>

    <section class="onedrive">
      <h2>Arquivos do projeto</h2>
      <a href="https://1drv.ms/f/c/1248F25D1EB3A40C/IgA3agz6rDstQoSZJ9I-T0puAcM-rx5-4oqCUXwZRXjaKxM?e=bAYZfI" target="_blank" rel="noopener">Abrir pasta no OneDrive</a>
      <p>Plantas, imagens e demais arquivos do projeto ficam nessa pasta compartilhada.</p>
    </section>

    <section class="checklist">
      <h2>Checklist</h2>
      <div class="add-row">
        <input id="newItem" type="text" placeholder="Adicionar item...">
        <input id="newDue" type="date" title="Prazo (opcional)">
        <button id="addBtn">Adicionar</button>
      </div>
      <ul id="list"></ul>
      <p id="banner" class="banner" hidden></p>
    </section>

    <section class="prazos">
      <h2>Prazos</h2>
      <ul id="prazosList"></ul>
    </section>

    <footer>Heitor Interiores</footer>
  </div>

<script id="itemsData" type="application/json">[]</script>
<script>
(function(){
  var items = [];
  try{ items = JSON.parse(document.getElementById('itemsData').textContent) || []; }catch(e){ items = []; }
  var writable = true;

  function renderList(){
    var ul = document.getElementById('list');
    ul.innerHTML = '';
    if(items.length === 0){
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nenhum item ainda. Adicione o primeiro item acima.';
      ul.appendChild(p);
      return;
    }
    items.forEach(function(it){
      var li = document.createElement('li');
      li.className = 'item' + (it.done ? ' done' : '');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!it.done;
      cb.disabled = !writable;
      cb.addEventListener('change', function(){ toggleItem(it.id); });
      var txt = document.createElement('div');
      txt.className = 'txt';
      var span = document.createElement('span');
      span.textContent = it.text;
      txt.appendChild(span);
      if(it.due){
        var due = document.createElement('span');
        due.className = 'due ' + dueClass(it);
        due.textContent = dueLabel(it);
        txt.appendChild(due);
      }
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = '\u00D7';
      del.title = 'Remover';
      del.disabled = !writable;
      del.addEventListener('click', function(){ deleteItem(it.id); });
      li.appendChild(cb); li.appendChild(txt); li.appendChild(del);
      ul.appendChild(li);
    });
  }

  function daysUntil(dateStr){
    var today = new Date(); today.setHours(0,0,0,0);
    var d = new Date(dateStr + 'T00:00:00');
    return Math.round((d - today) / 86400000);
  }

  function dueClass(it){
    if(it.done) return '';
    var diff = daysUntil(it.due);
    if(diff < 0) return 'late';
    if(diff <= 3) return 'soon';
    return '';
  }

  function dueLabel(it){
    var d = new Date(it.due + 'T00:00:00');
    var formatted = d.toLocaleDateString('pt-BR');
    if(it.done) return 'Prazo: ' + formatted;
    var diff = daysUntil(it.due);
    if(diff < 0) return 'Venceu em ' + formatted;
    if(diff === 0) return 'Vence hoje';
    if(diff === 1) return 'Vence amanhã';
    if(diff <= 3) return 'Vence em ' + diff + ' dias';
    return 'Prazo: ' + formatted;
  }

  function renderPrazos(){
    var ul = document.getElementById('prazosList');
    ul.innerHTML = '';
    var withDue = items.filter(function(it){ return it.due && !it.done; });
    withDue.sort(function(a,b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });
    if(withDue.length === 0){
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'Nenhum item com prazo definido no momento.';
      ul.appendChild(p);
      return;
    }
    withDue.forEach(function(it){
      var li = document.createElement('li');
      var span = document.createElement('span');
      span.textContent = it.text;
      var tag = document.createElement('span');
      tag.className = 'due ' + dueClass(it);
      tag.textContent = dueLabel(it);
      li.appendChild(span); li.appendChild(tag);
      ul.appendChild(li);
    });
  }

  function toggleItem(id){
    items = items.map(function(it){
      if(it.id === id){ return { id: it.id, text: it.text, done: !it.done, due: it.due || null }; }
      return it;
    });
    renderList();
    renderPrazos();
    persist();
  }

  function deleteItem(id){
    items = items.filter(function(it){ return it.id !== id; });
    renderList();
    renderPrazos();
    persist();
  }

  function addItem(){
    var input = document.getElementById('newItem');
    var dueInput = document.getElementById('newDue');
    var text = input.value.trim();
    if(!text) return;
    items.push({
      id: 'i' + Date.now() + Math.random().toString(36).slice(2,7),
      text: text, done: false,
      due: dueInput.value || null
    });
    input.value = '';
    dueInput.value = '';
    renderList();
    renderPrazos();
    persist();
  }

  function setReadOnly(){
    if(!writable) return;
    writable = false;
    var b = document.getElementById('banner');
    b.hidden = false;
    b.textContent = 'Modo somente leitura nesta visita — peça acesso de edição no link para marcar ou adicionar itens.';
    document.getElementById('addBtn').disabled = true;
    document.getElementById('newItem').disabled = true;
    document.getElementById('newDue').disabled = true;
    renderList();
  }

  var errTimer = null;
  function showTempError(){
    var b = document.getElementById('banner');
    b.hidden = false;
    b.textContent = 'Não foi possível salvar agora. Verifique a conexão e tente de novo.';
    clearTimeout(errTimer);
    errTimer = setTimeout(function(){ if(writable){ b.hidden = true; } }, 4500);
  }

  async function persist(){
    if(!writable) return;
    try{
      document.getElementById('itemsData').textContent = JSON.stringify(items);
      var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      var ns = await window.claude.use('artifact');
      if(!ns){ setReadOnly(); return; }
      await ns.publish(html);
    }catch(e){
      var code = e && e.code;
      if(code === 'not_writer' || code === 'not_granted' || code === 'consent_required'){
        setReadOnly();
      }else{
        showTempError();
      }
    }
  }

  document.getElementById('addBtn').addEventListener('click', addItem);
  document.getElementById('newItem').addEventListener('keydown', function(e){ if(e.key === 'Enter') addItem(); });

  renderList();
  renderPrazos();
})();
</script>
</body>
</html>
